    <script>
        function toggleEditMode() {
            document.querySelectorAll('.view-mode').forEach(el => el.classList.toggle('hidden'));
            document.querySelectorAll('.edit-mode').forEach(el => el.classList.toggle('hidden'));
            const toggleBtn = document.getElementById('toggleEditBtn');
            if(toggleBtn) toggleBtn.classList.toggle('hidden');
        }

        function previewQR(input) {
            if (input.files && input.files[0]) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    document.getElementById('qrPreview').src = e.target.result;
                }
                reader.readAsDataURL(input.files[0]);
            }
        }

        function copyText(text, containerElement, type) {
            // ป้องกันการทำงานตอนอยู่ในโหมดแก้ไข
            if(!document.querySelector('.edit-mode').classList.contains('hidden')) return;

            const textArea = document.createElement("textarea");
            textArea.value = text;
            textArea.style.position = "fixed";
            document.body.appendChild(textArea);
            textArea.focus();
            textArea.select();

            try {
                document.execCommand('copy');
                showToast();
                const buttonElement = containerElement.querySelector(type === 'kbank' ? '.kbank-btn' : '.true-btn');
                const originalHtml = buttonElement.innerHTML;
                buttonElement.innerHTML = `สำเร็จ`;
                setTimeout(() => { buttonElement.innerHTML = originalHtml; }, 2000);
            } catch (err) {
                console.error('คัดลอกไม่สำเร็จ', err);
            }
            document.body.removeChild(textArea);
        }

        function showToast() {
            const toast = document.getElementById('toast');
            toast.classList.remove('opacity-0', 'translate-y-4');
            toast.classList.add('opacity-100', 'translate-y-0');
            setTimeout(() => {
                toast.classList.remove('opacity-100', 'translate-y-0');
                toast.classList.add('opacity-0', 'translate-y-4');
            }, 2500);
        }
    </script>
