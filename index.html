// จัดการการบันทึกข้อมูลเมื่อแอดมินกด Save
if (is_user_logged_in() && current_user_can('administrator') && $_SERVER['REQUEST_METHOD'] == 'POST' && isset($_POST['inline_edit_nonce'])) {
    if (wp_verify_nonce($_POST['inline_edit_nonce'], 'inline_edit_action')) {
        update_option('store_name_opt', sanitize_text_field($_POST['store_name']));
        update_option('store_acc_name_opt', sanitize_text_field($_POST['account_name']));
        update_option('store_kbank_num_opt', sanitize_text_field($_POST['kbank_number']));
        update_option('store_true_num_opt', sanitize_text_field($_POST['truemoney_number']));
        
        // จัดการอัปโหลดรูป QR Code หากมีการเลือกรูปใหม่
        if (!empty($_FILES['qr_code_file']['name'])) {
            require_once(ABSPATH . 'wp-admin/includes/file.php');
            require_once(ABSPATH . 'wp-admin/includes/media.php');
            require_once(ABSPATH . 'wp-admin/includes/image.php');
            
            $attachment_id = media_handle_upload('qr_code_file', 0);
            if (!is_wp_error($attachment_id)) {
                update_option('store_qr_img_opt', wp_get_attachment_url($attachment_id));
            }
        }
        
        wp_redirect(remove_query_arg());
        exit;
    }
}

    <script>
        function toggleEditMode() {
            const viewElements = document.querySelectorAll('.view-mode');
            const editElements = document.querySelectorAll('.edit-mode');
            const toggleBtn = document.getElementById('toggleEditBtn');

            viewElements.forEach(el => el.classList.toggle('hidden'));
            editElements.forEach(el => el.classList.toggle('hidden'));
            if(toggleBtn) toggleBtn.classList.toggle('hidden');
        }

        function previewQR(input) {
            if (input.files && input.files[0]) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    document.getElementById('qrPreview').src = e.target.result;
                }
                reader.readAsDataURL(input.files[0]);
            }
        }
    </script>
